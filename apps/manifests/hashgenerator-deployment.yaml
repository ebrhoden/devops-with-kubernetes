apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-dep
  namespace: exercises

spec:
  replicas: 1

  selector:
    matchLabels:
      app: log

  template:
    metadata:
      labels:
        app: log

    spec:
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: shared-pvc

        - name: config-volume
          configMap:
            name: settings-configmap

      containers:
        - name: log-writer
          image: ebrhoden/log-writter:0.0.2

          volumeMounts:
            - name: shared-storage
              mountPath: /shared

        - name: log-reader
          image: ebrhoden/log-reader:0.0.4

          ports:
            - containerPort: 8080   

          volumeMounts:
            - name: config-volume
              mountPath: /config
            
            - name: shared-storage
              mountPath: /shared

          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: settings-configmap
                  key: MESSAGE